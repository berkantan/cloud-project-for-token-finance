name: CI

on:
  push:
    branches: main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indirir
        uses: actions/checkout@v4

      - name: Buildx kurar
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub'a login olur
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build alır
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/token-payment-api:${{ github.sha }}

      - name: Güvenlik kontrolu yapar
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/token-payment-api:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: 1

      - name: Docker Hub'a gonderir
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/token-payment-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH anahtarini hazirlar
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: VM'de yeni surumu calistirir
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/token-payment-api:${{ github.sha }}
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
            sudo docker pull $IMAGE &&
            sudo docker rm -f payment-api &&
            sudo docker run -d --name payment-api --network monitoring -p 127.0.0.1:9093:9093 --restart unless-stopped --log-opt max-size=10m --log-opt max-file=3 $IMAGE &&
            sleep 5 &&
            curl -sf localhost:9093/metrics > /dev/null &&
            echo 'Deploy başarılı'
          "
